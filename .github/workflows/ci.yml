name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            packages/memory-core/package-lock.json
            packages/memory-toolpkg/package-lock.json

      - name: Install memory core dependencies
        run: npm ci
        working-directory: packages/memory-core

      - name: Test memory core
        run: npm test
        working-directory: packages/memory-core

      - name: Install ToolPkg dependencies
        run: npm ci
        working-directory: packages/memory-toolpkg

      - name: Check runtime syntax and legacy TypeScript
        run: npm run typecheck
        working-directory: packages/memory-toolpkg

      - name: Test ToolPkg runtime
        run: npm test
        working-directory: packages/memory-toolpkg

      - name: Build ToolPkg archive
        run: npm run package
        working-directory: packages/memory-toolpkg

      - uses: actions/upload-artifact@v4
        with:
          name: claude-local-memory-toolpkg
          path: packages/memory-toolpkg/build/claude-local-memory.toolpkg
